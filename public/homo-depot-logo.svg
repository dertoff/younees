<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background Orange -->
  <rect width="500" height="500" fill="#F96302"/>

  <!-- White Inset Border -->
  <rect x="35" y="35" width="430" height="430" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="miter"/>

  <!-- Rotated Group -45 deg around center -->
  <g transform="translate(250, 250) rotate(-45)">
    
    <!-- ================= THE ================= -->
    <g transform="translate(-170, -78)">
      <!-- T -->
      <path d="M0,0 L52,0 L52,14 L34,14 L34,48 L18,48 L18,14 L0,14 Z" fill="#FFFFFF"/>
      <!-- Serifs on T -->
      <path d="M0,0 L0,8 L4,4 L4,0 Z M52,0 L52,8 L48,4 L48,0 Z M14,48 L38,48 L38,44 L14,44 Z" fill="#FFFFFF"/>
      <!-- Stencil cut in T -->
      <rect x="17" y="12" width="18" height="4" fill="#F96302"/>

      <!-- H -->
      <g transform="translate(58, 0)">
        <path d="M0,0 L18,0 L18,48 L0,48 Z" fill="#FFFFFF"/>
        <path d="M32,0 L50,0 L50,48 L32,48 Z" fill="#FFFFFF"/>
        <rect x="18" y="18" width="14" height="12" fill="#FFFFFF"/>
        <!-- Stencil cut -->
        <rect x="16" y="16" width="18" height="4" fill="#F96302"/>
        <!-- Serifs -->
        <path d="M-2,0 L20,0 L20,3 L-2,3 Z M30,0 L52,0 L52,3 L30,3 Z M-2,45 L20,45 L20,48 L-2,48 Z M30,45 L52,45 L52,48 L30,48 Z" fill="#FFFFFF"/>
      </g>

      <!-- E -->
      <g transform="translate(114, 0)">
        <path d="M0,0 L18,0 L18,48 L0,48 Z" fill="#FFFFFF"/>
        <path d="M18,0 L46,0 L46,12 L18,12 Z" fill="#FFFFFF"/>
        <path d="M18,18 L38,18 L38,29 L18,29 Z" fill="#FFFFFF"/>
        <path d="M18,36 L46,36 L46,48 L18,48 Z" fill="#FFFFFF"/>
        <rect x="16" y="16" width="8" height="4" fill="#F96302"/>
        <rect x="16" y="34" width="8" height="4" fill="#F96302"/>
        <!-- Serifs -->
        <path d="M-2,0 L20,0 L20,3 L-2,3 Z M-2,45 L20,45 L20,48 L-2,48 Z M46,0 L46,12 L43,8 Z M46,48 L46,36 L43,40 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- ================= HOMO ================= -->
    <!-- H -->
    <g transform="translate(-215, -20)">
      <rect x="0" y="0" width="26" height="90" fill="#FFFFFF"/>
      <rect x="54" y="0" width="26" height="90" fill="#FFFFFF"/>
      <rect x="26" y="34" width="28" height="22" fill="#FFFFFF"/>
      <!-- stencil cut -->
      <rect x="24" y="32" width="32" height="5" fill="#F96302"/>
      <!-- Slab Serifs on H -->
      <rect x="-4" y="0" width="34" height="6" fill="#FFFFFF"/>
      <rect x="50" y="0" width="34" height="6" fill="#FFFFFF"/>
      <rect x="-4" y="84" width="34" height="6" fill="#FFFFFF"/>
      <rect x="50" y="84" width="34" height="6" fill="#FFFFFF"/>
    </g>

    <!-- O (first O) -->
    <g transform="translate(-125, -20)">
      <!-- Outer oval -->
      <path d="M42,0 C68,0 84,18 84,45 C84,72 68,90 42,90 C16,90 0,72 0,45 C0,18 16,0 42,0 Z" fill="#FFFFFF"/>
      <!-- Inner hole -->
      <path d="M42,22 C53,22 60,32 60,45 C60,58 53,68 42,68 C31,68 24,58 24,45 C24,32 31,22 42,22 Z" fill="#F96302"/>
      <!-- Diagonal stencil cuts (top-right and bottom-left) -->
      <line x1="60" y1="10" x2="76" y2="-6" stroke="#F96302" stroke-width="6" stroke-linecap="square"/>
      <line x1="8" y1="96" x2="24" y2="80" stroke="#F96302" stroke-width="6" stroke-linecap="square"/>
    </g>

    <!-- M -->
    <g transform="translate(-30, -20)">
      <!-- M shape -->
      <path d="M0,0 L24,0 L49,52 L74,0 L98,0 L98,90 L74,90 L74,34 L54,72 L44,72 L24,34 L24,90 L0,90 Z" fill="#FFFFFF"/>
      <!-- Serifs on M -->
      <rect x="-4" y="0" width="28" height="6" fill="#FFFFFF"/>
      <rect x="74" y="0" width="28" height="6" fill="#FFFFFF"/>
      <rect x="-4" y="84" width="28" height="6" fill="#FFFFFF"/>
      <rect x="74" y="84" width="28" height="6" fill="#FFFFFF"/>
      <!-- Stencil cut across center of M -->
      <rect x="22" y="40" width="54" height="5" fill="#F96302"/>
    </g>

    <!-- O (second O in HOMO - identical to first O) -->
    <g transform="translate(80, -20)">
      <!-- Outer oval -->
      <path d="M42,0 C68,0 84,18 84,45 C84,72 68,90 42,90 C16,90 0,72 0,45 C0,18 16,0 42,0 Z" fill="#FFFFFF"/>
      <!-- Inner hole -->
      <path d="M42,22 C53,22 60,32 60,45 C60,58 53,68 42,68 C31,68 24,58 24,45 C24,32 31,22 42,22 Z" fill="#F96302"/>
      <!-- Diagonal stencil cuts (top-right and bottom-left) -->
      <line x1="60" y1="10" x2="76" y2="-6" stroke="#F96302" stroke-width="6" stroke-linecap="square"/>
      <line x1="8" y1="96" x2="24" y2="80" stroke="#F96302" stroke-width="6" stroke-linecap="square"/>
    </g>

    <!-- ================= DEPOT ================= -->
    <!-- D -->
    <g transform="translate(-155, 86)">
      <path d="M0,0 L36,0 C58,0 72,14 72,33 C72,52 58,66 36,66 L0,66 Z" fill="#FFFFFF"/>
      <path d="M20,16 L34,16 C44,16 50,22 50,33 C50,44 44,50 34,50 L20,50 Z" fill="#F96302"/>
      <!-- Serifs & stencil -->
      <rect x="-3" y="0" width="26" height="5" fill="#FFFFFF"/>
      <rect x="-3" y="61" width="26" height="5" fill="#FFFFFF"/>
      <rect x="18" y="14" width="6" height="38" fill="#F96302"/>
    </g>

    <!-- E -->
    <g transform="translate(-72, 86)">
      <rect x="0" y="0" width="18" height="66" fill="#FFFFFF"/>
      <rect x="18" y="0" width="36" height="16" fill="#FFFFFF"/>
      <rect x="18" y="25" width="28" height="15" fill="#FFFFFF"/>
      <rect x="18" y="50" width="36" height="16" fill="#FFFFFF"/>
      <rect x="-3" y="0" width="24" height="5" fill="#FFFFFF"/>
      <rect x="-3" y="61" width="24" height="5" fill="#FFFFFF"/>
      <rect x="16" y="22" width="8" height="5" fill="#F96302"/>
      <rect x="16" y="47" width="8" height="5" fill="#F96302"/>
    </g>

    <!-- P -->
    <g transform="translate(-8, 86)">
      <path d="M0,0 L36,0 C52,0 64,10 64,26 C64,42 52,50 36,50 L18,50 L18,66 L0,66 Z" fill="#FFFFFF"/>
      <path d="M18,14 L34,14 C42,14 46,18 46,26 C46,34 42,37 34,37 L18,37 Z" fill="#F96302"/>
      <rect x="-3" y="0" width="24" height="5" fill="#FFFFFF"/>
      <rect x="-3" y="61" width="24" height="5" fill="#FFFFFF"/>
      <rect x="16" y="12" width="6" height="27" fill="#F96302"/>
    </g>

    <!-- O -->
    <g transform="translate(65, 86)">
      <path d="M33,0 C54,0 66,13 66,33 C66,53 54,66 33,66 C12,66 0,53 0,33 C0,13 12,0 33,0 Z" fill="#FFFFFF"/>
      <path d="M33,16 C42,16 48,23 48,33 C48,43 42,50 33,50 C24,50 18,43 18,33 C18,23 24,16 33,16 Z" fill="#F96302"/>
      <line x1="47" y1="8" x2="60" y2="-5" stroke="#F96302" stroke-width="5" stroke-linecap="square"/>
      <line x1="6" y1="71" x2="19" y2="58" stroke="#F96302" stroke-width="5" stroke-linecap="square"/>
    </g>

    <!-- T -->
    <g transform="translate(142, 86)">
      <path d="M0,0 L56,0 L56,16 L38,16 L38,66 L18,66 L18,16 L0,16 Z" fill="#FFFFFF"/>
      <rect x="-2" y="0" width="60" height="5" fill="#FFFFFF"/>
      <rect x="14" y="61" width="28" height="5" fill="#FFFFFF"/>
      <rect x="16" y="14" width="24" height="5" fill="#F96302"/>
    </g>

  </g>
</svg>