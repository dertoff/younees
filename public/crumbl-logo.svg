<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Solid Pink Container matching image #FFAECC / #FFAEC9 -->
  <rect width="512" height="512" rx="100" fill="#FFAEC9" />

  <!-- The Exact Baker Outline Icon from user image -->
  <g transform="translate(256, 256)">
    <!-- 1. Thick Outer White Background Silhouette / Border Shape -->
    <!-- Outer Contour with White Fill & Stroke for the thick white frame -->
    <path
      d="M -75 52
         C -105 52, -145 15, -145 -35
         C -145 -95, -95 -135, -45 -145
         C -25 -175, 25 -175, 48 -145
         C 95 -142, 135 -105, 138 -55
         C 120 -55, 105 -40, 105 -20
         C 105 0, 120 12, 142 12
         C 142 52, 105 52, 75 52
         L 75 90
         L 105 90
         C 114 90, 122 98, 122 107
         C 122 116, 114 124, 105 124
         L 55 124
         C 45 145, 25 158, 0 158
         C -25 158, -45 145, -55 124
         L -105 124
         C -114 124, -122 116, -122 107
         C -122 98, -114 90, -105 90
         L -75 90
         Z"
      fill="#FFFFFF"
      stroke="#FFFFFF"
      stroke-width="26"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Chin Bottom Smile Arc Outer White -->
    <path
      d="M -60 148 C -35 188, 35 188, 60 148"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="36"
      stroke-linecap="round"
    />

    <!-- 2. Pink Shapes & Lines drawn directly inside the white silhouette -->

    <!-- Main Hat Body Pink Inner Silhouette (leaving the outer white border) -->
    <path
      d="M -62 40
         C -90 40, -125 10, -125 -32
         C -125 -82, -82 -118, -38 -126
         C -20 -152, 20 -152, 38 -126
         C 80 -124, 116 -92, 118 -48
         C 100 -48, 88 -35, 88 -18
         C 88 0, 100 10, 120 10
         C 120 40, 90 40, 62 40
         Z"
      fill="#FFAEC9"
    />

    <!-- White Inner Fill for the hat interior so it's a white hat with pink outlines! -->
    <!-- In the user's image, the hat is WHITE inside, with a PINK outer line, surrounded by a thick WHITE halo! -->
    <path
      d="M -54 30
         C -78 30, -110 5, -110 -30
         C -110 -72, -72 -104, -34 -110
         C -18 -132, 18 -132, 34 -110
         C 70 -108, 100 -80, 102 -42
         C 86 -42, 75 -30, 75 -15
         C 75 0, 85 8, 104 8
         C 104 30, 78 30, 54 30
         Z"
      fill="#FFFFFF"
    />

    <!-- Pink Bite Arc / Inner Hat Fold Line -->
    <path
      d="M -6 -75 C 16 -40, 16 12, -4 40"
      fill="none"
      stroke="#FFAEC9"
      stroke-width="15"
      stroke-linecap="round"
    />

    <!-- 3 Pink Cookie Chips in top right of hat -->
    <ellipse cx="44" cy="-38" rx="10" ry="8" transform="rotate(-30 44 -38)" fill="#FFAEC9" />
    <ellipse cx="24" cy="2" rx="11" ry="8" transform="rotate(30 24 2)" fill="#FFAEC9" />
    <ellipse cx="62" cy="8" rx="10" ry="7" transform="rotate(-40 62 8)" fill="#FFAEC9" />

    <!-- Pink Arch Separator between hat and face -->
    <path
      d="M -68 52 C -20 38, 20 38, 68 52"
      fill="none"
      stroke="#FFAEC9"
      stroke-width="14"
      stroke-linecap="round"
    />

    <!-- Face Area is White (formed by the outer white shape) -->
    <!-- Pink Eyes -->
    <ellipse cx="-28" cy="72" rx="9" ry="8" fill="#FFAEC9" />
    <ellipse cx="28" cy="72" rx="9" ry="8" fill="#FFAEC9" />

    <!-- Pink Mustache Line & Center Nose Dip -->
    <path
      d="M -98 107 L -22 107 C -22 124, 22 124, 22 107 L 98 107"
      fill="none"
      stroke="#FFAEC9"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Pink Smile / Chin Contour inside the white bottom jaw -->
    <path
      d="M -44 148 C -24 176, 24 176, 44 148"
      fill="none"
      stroke="#FFAEC9"
      stroke-width="15"
      stroke-linecap="round"
    />
  </g>
</svg>
